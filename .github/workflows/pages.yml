name: Radar Cultural PR

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Cache do PNCP
        if: github.event_name != 'push'
        uses: actions/cache@v5
        with:
          path: .cache/pncp
          key: pncp-${{ github.run_id }}
          restore-keys: |
            pncp-

      - name: Coletar dados do PNCP
        if: github.event_name != 'push'
        run: npm run coletar

      - name: Versionar snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/dados/licitacoes.json
          if git diff --cached --quiet; then
            echo "Sem mudanças no snapshot."
          else
            git commit -m "dados: atualiza snapshot [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Build
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar no Pages
        id: deploy
        uses: actions/deploy-pages@v4
